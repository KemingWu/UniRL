# @package _global_
# SD3.5-Medium GRPO — text-rendering reward via remote Qwen3-VL-MoE-235B judge.
#
# Structure mirrors ``sd3_dancegrpo_hpsv3pp.yaml`` (LoRA rank 32, DanceSDE,
# 48×16=768 samples/rollout, 10 inference steps) except:
#   - reward.backend → RemoteRewardBackend pointing at Node 0's judge service
#   - data_source → datasets/infographic_medium/{train,test}.jsonl
#   - PRETRAINED_MODEL default → local shared CephFS path for SD3.5-medium
#
# 2-node deployment (see examples/diffusion/sd3/2node_jobs/):
#   Node 0: reward service (Qwen3-VL-MoE-235B, vLLM TP=8)
#   Node 1: SD3.5-Medium GRPO training (FSDP + LoRA, 8 GPUs)
#
# The trainer sees ONE remote reward (``text_rendering_judge``); the scorer
# breaks it down into three sub-metrics — text_render_reward (advantage-
# driving), n_errors (monitoring), parse_ok (judge health).

num_devices: 8                  # Node 1: 8 GPUs
batch_size: 48                  # prompts_per_rollout (48 × 16 samples = 768/rollout)
adv_use_global_std: true        # v1 parity — one std over the whole batch
num_rollouts: 10000

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-sd3-text-rendering}
  run_name: ${oc.env:WANDB_RUN_NAME,sd3_text_rendering_grpo}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: ["sd3.5", "grpo", "trainside", "text-rendering", "qwen3vl-judge"]
  log_media: true
  media_max_items: 8
  media_log_interval: 1

bundle:
  _target_: unirl.models.sd3.bundle.SD3Bundle.from_config
  config:
    _target_: unirl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,/apdcephfs_hldy/share_305110755/hunyuan/public_models/stable-diffusion-3.5-medium}
    model_precision: bf16
    shift: 3.0

pipeline:
  _target_: unirl.models.sd3.pipeline.SD3Pipeline
  shift: 3.0
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  strategy:
    _target_: unirl.sde.kernels.DanceSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["JointTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: false
    activation_checkpointing: false
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 8

# Reward: remote 235B judge on Node 0. The scorer produces three sub-metrics —
# GRPO advantage is driven by ``text_render_reward`` (exp(-α·n_errors) ∈ (0,1]);
# ``n_errors`` and ``parse_ok`` are monitoring-only.
reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.remote.RemoteRewardBackend
    base_device: cpu
    config:
      _target_: unirl.reward.remote.RemoteRewardSpec
      base_url: ${oc.env:REWARD_SERVICE_URL,http://localhost:8080}
      required_rewards: [text_rendering_judge]
      reward_weights: {text_rendering_judge: 1.0}
      batch_size: 32
      timeout: 600.0
      max_retries: 3

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  stage_attr: diffusion
  clip_range: 1.0e-4
  clip_schedule: constant
  old_logp_source: replay
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.sd3.conditions.SD3Conditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 8
  max_grad_norm: 1.0
  num_updates_per_batch: 2

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      # JSONL because infographic prompts contain embedded newlines
      # (TextPromptDataset auto-detects `.jsonl` and reads {"prompt": ...}).
      data_path: datasets/infographic_medium/train.jsonl
      eval_data_path: datasets/infographic_medium/test.jsonl
      seed: 42
    algorithm:
      prompts_per_rollout: ${batch_size}

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  eta: 0.7
  samples_per_prompt: 16
  seed: 42
  init_same_noise: false
  scheduler:
    _target_: unirl.sde.index_schedule.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
